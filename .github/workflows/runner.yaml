name: Run gp-api then gp-explorer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              -N \
              -L 127.0.0.1:27017:127.0.0.1:27017 \
              -L 127.0.0.1:6379:127.0.0.1:6379 \
              tunnel@75.119.156.81 &
          sleep 5

      - name: Checkout gp-api (private)
        uses: actions/checkout@v4
        with:
          repository: bakkaliomar500/gp-api
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: gp-api
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & run gp-api
        working-directory: gp-api
        run: |
          npm ci || npm install
          npm run build --if-present
          npm start &
          sleep 10

      - name: Checkout gp-explorer (private)
        uses: actions/checkout@v4
        with:
          repository: bakkaliomar500/gp-explorer
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: gp-explorer
          fetch-depth: 1

      - name: Install & run gp-explorer
        working-directory: gp-explorer
        run: |
          npm ci || npm install
          npm run build --if-present
          npm start
