name: Run gp-api then gp-explorer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-projects:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gp-api (private)
        uses: actions/checkout@v4
        with:
          repository: bakkaliomar500/gp-api
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: gp-api
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & run gp-api
        working-directory: gp-api
        run: |
          npm ci || npm install
          npm run build --if-present
          npm start &
          sleep 10

      - name: Checkout gp-explorer (private)
        uses: actions/checkout@v4
        with:
          repository: bakkaliomar500/gp-explorer
          token: ${{ secrets.GH_PAT }}
          ref: main
          path: gp-explorer
          fetch-depth: 1

      - name: Install & run gp-explorer
        working-directory: gp-explorer
        run: |
          npm ci || npm install
          npm run build --if-present
          npm start
